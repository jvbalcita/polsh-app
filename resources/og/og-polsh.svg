  <text x="111" y="444" font-family="monospace" font-size="12" fill="#6a6a7a" text-anchor="middle">18 styles</text>

  <rect x="174" y="424" width="132" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
