<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="110%" y2="110%">
      <stop offset="0%" stop-color="#16163a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0c1828" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="limeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0ff4f" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#e0ff4f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background + grid -->
  <rect width="1200" height="630" fill="#0a0a0c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top lime accent bar -->
  <rect width="1200" height="3" fill="#e0ff4f"/>

  <!-- ─── LEFT COLUMN (x=60..570) ─────────────────────────── -->

  <!-- Wordmark -->
  <text x="60" y="68" font-family="monospace" font-size="22" font-weight="700" fill="#ffffff">polsh</text>
  <text x="112" y="68" font-family="monospace" font-size="22" font-weight="400" fill="#e0ff4f">.work</text>

  <!-- Headline: 3 lines at 58px — each ~450px wide, fits in 510px column -->
  <text x="60" y="214" font-family="sans-serif" font-size="58" font-weight="700" fill="#f0f0f2"   letter-spacing="-1.5">Style your code</text>
  <text x="60" y="284" font-family="sans-serif" font-size="58" font-weight="700" fill="#e0ff4f"   letter-spacing="-1.5">screenshots in</text>
  <text x="60" y="354" font-family="sans-serif" font-size="58" font-weight="700" fill="#e0ff4f"   letter-spacing="-1.5">seconds.</text>

  <!-- Tagline -->
  <text x="60" y="396" font-family="sans-serif" font-size="17" fill="#5a5a6a">No Figma. No plugins. Drop a screenshot, pick a style, export.</text>

  <!-- Stat pills -->
