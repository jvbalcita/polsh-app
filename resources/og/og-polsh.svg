  <rect x="318" y="424" width="122" height="30" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <text x="379" y="444" font-family="monospace" font-size="12" fill="#6a6a7a" text-anchor="middle">Free forever</text>

  <!-- ─── RIGHT COLUMN: single editor card (x=618..1148) ───── -->

